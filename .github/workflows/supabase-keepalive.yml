# Podtrzymanie projektu Supabase (NWoW 2027).
# Darmowy plan wstrzymuje projekt po 7 dniach bez ruchu — co 2 dni robimy jedno zapytanie do bazy.
# Klucz anon jest publiczny (ten sam co w js/config.js). Ręczne uruchomienie: Actions → Supabase keep-alive → Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zapytanie do bazy
        env:
          URL: https://uvonqpbngdwlxwybbnxu.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2b25xcGJuZ2R3bHh3eWJibnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MzQzMjYsImV4cCI6MjEwNTMxMDMyNn0.MuD7lA6wiSBn_bNrUmF5EX52CYWNIuTf8AjXtSlMOzw
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" --retry 3 --retry-delay 20 \
            "$URL/rest/v1/sessions?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat body.json; echo
          # błąd = czerwony przebieg i mail z GitHuba (np. gdy projekt jednak został wstrzymany)
          test "$code" = "200"
